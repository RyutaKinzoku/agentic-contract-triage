# Local development stack: vector store, agent service, and orchestration.
# Brings the whole system up with `docker compose up`.
# (The top-level `version:` key is intentionally omitted — it's obsolete in
# Compose v2.)

services:
  qdrant:
    image: qdrant/qdrant:latest   # pin to a specific tag for reproducible runs
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  agent:
    build: ./agent
    env_file: .env
    environment:
      # Point the agent at the in-network Qdrant service.
      - QDRANT_URL=http://qdrant:6333
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest        # pin to a specific tag for reproducible runs
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=UTC
      # Local dev only: allows the editor over plain http://localhost.
      # Do not disable secure cookies in a deployed environment.
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      agent:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qdrant_storage:
  n8n_data: